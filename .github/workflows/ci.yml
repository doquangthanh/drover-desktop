name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # The colours (theme_data.rs) are generated from drover-core/design/tokens.json; check them against its main branch.
      - uses: actions/checkout@v4
        with: { repository: doquangthanh/drover-core, ref: main, path: drover-core }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Generated colours match drover-core/design/tokens.json
        run: node drover-core/design/gen-tokens.mjs --check --require --only desktop --desktop rust/crates/drover-desktop-native/src
      - name: System libraries for GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libfontconfig1-dev libfreetype-dev libvulkan-dev
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: rust
      - run: cargo build --locked -p drover-desktop-native
        working-directory: rust
      - run: cargo test --locked -p drover-desktop-native
        working-directory: rust
