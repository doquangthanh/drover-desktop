[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.23"
edition = "2024"
license = "Apache-2.0"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# gpui 0.2.2 -> zed-async-tar -> xattr 0.2.3 reads libc::ENOATTR, which libc 0.2.19x no longer has on Linux.
[patch.crates-io]
xattr = { path = "vendor/xattr-0.2.3" }
# gpui 0.2.2 -> zed-xim panics ("Encoding Error") when ibus/Unikey sends ISO 8859-1 compound text: decode it instead.
zed-xim = { path = "vendor/zed-xim-0.4.0-zed" }
