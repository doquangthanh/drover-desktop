[package]
name = "drover-desktop-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native desktop client of the drover daemon, drawn with GPUI"

[[bin]]
name = "drover-native"
path = "src/main.rs"

[dependencies]
gpui = "=0.2.2"
alacritty_terminal = "=0.26.0"  # same pin as drover-core
serde_json = "1.0.154"
drover-core = { git = "https://github.com/doquangthanh/drover-core", tag = "v0.2.0-dev" }
drover-proto = { git = "https://github.com/doquangthanh/drover-core", tag = "v0.2.0-dev" }
