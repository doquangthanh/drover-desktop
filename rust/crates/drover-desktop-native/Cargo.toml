[package]
name = "drover-desktop-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native desktop client of the drover daemon, drawn with GPUI"

[[bin]]
name = "drover-native"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3.0.12"  # Windows icon (build.rs); already in the lock through gpui

[dependencies]
gpui = "=0.2.2"
alacritty_terminal = "=0.26.0"  # same pin as drover-core
serde_json = "1.0.154"
toml = "0.8"  # plugin manifests (plugins.rs); already in the lock
base64 = "0.22"  # Kitty graphics payloads (kitty_graphics.rs)
flate2 = "1"  # o=z compressed images; already in the lock
image = { version = "0.25", default-features = false, features = ["png"] }  # same crate gpui paints with
drover-core = { git = "https://github.com/doquangthanh/drover-core", tag = "v0.2.18" }
drover-proto = { git = "https://github.com/doquangthanh/drover-core", tag = "v0.2.18" }
